<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1c1c1e" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1c1c1e" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1c1c1e" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1c1c1e" stroke-width="1"/>

  <!-- Sparkline decorative — Sève des Lumichênes -->
  <polyline points="80,420 160,380 240,350 320,370 400,310 480,280 560,260"
            fill="none" stroke="#32d74b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <!-- Sparkline decorative — Mycélium -->
  <polyline points="640,400 720,360 800,390 880,340 960,300 1040,320 1120,290"
            fill="none" stroke="#bf5af2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>

  <!-- Sparkline decorative — Petit Soleil -->
  <polyline points="80,500 200,470 360,490 520,440 680,460 840,410 1000,390 1120,370"
            fill="none" stroke="#ff9f0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>

  <!-- Logo badge -->
  <rect x="80" y="180" width="72" height="72" rx="18" fill="#1c1c1e"/>
  <text x="116" y="237" font-family="-apple-system, Helvetica Neue, sans-serif"
        font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle">T</text>
  <circle cx="147" cy="193" r="10" fill="#32d74b"/>

  <!-- Title -->
  <text x="172" y="226" font-family="-apple-system, Helvetica Neue, sans-serif"
        font-size="62" font-weight="700" fill="#ffffff" letter-spacing="-2">Tero</text>
  <text x="340" y="226" font-family="-apple-system, Helvetica Neue, sans-serif"
        font-size="62" font-weight="300" fill="#636366" letter-spacing="-2"> Marchés</text>

  <!-- Subtitle -->
  <text x="80" y="280" font-family="-apple-system, Helvetica Neue, sans-serif"
        font-size="26" font-weight="400" fill="#48484a">Suivi des prix · 5 actifs · 7 tours · Chronomètre</text>

  <!-- Separator -->
  <line x1="80" y1="316" x2="480" y2="316" stroke="#2c2c2e" stroke-width="1"/>

  <!-- Asset pills -->
  <!-- Sève des Lumichênes -->
  <rect x="80" y="340" width="230" height="44" rx="12" fill="#1c1c1e"/>
  <circle cx="104" cy="362" r="7" fill="#32d74b"/>
  <text x="120" y="367" font-family="-apple-system, Helvetica Neue, sans-serif"
        font-size="16" font-weight="600" fill="#ffffff">Sève des Lumichênes</text>

  <!-- Sève des Sirrococotier -->
  <rect x="322" y="340" width="248" height="44" rx="12" fill="#1c1c1e"/>
  <circle cx="346" cy="362" r="7" fill="#34c759"/>
  <text x="362" y="367" font-family="-apple-system, Helvetica Neue, sans-serif"
        font-size="16" font-weight="600" fill="#ffffff">Sève des Sirrococotier</text>

  <!-- Petit Soleil -->
  <rect x="582" y="340" width="160" height="44" rx="12" fill="#1c1c1e"/>
  <circle cx="606" cy="362" r="7" fill="#ff9f0a"/>
  <text x="622" y="367" font-family="-apple-system, Helvetica Neue, sans-serif"
        font-size="16" font-weight="600" fill="#ffffff">Petit Soleil</text>

  <!-- Eau -->
  <rect x="754" y="340" width="100" height="44" rx="12" fill="#1c1c1e"/>
  <circle cx="778" cy="362" r="7" fill="#0a84ff"/>
  <text x="794" y="367" font-family="-apple-system, Helvetica Neue, sans-serif"
        font-size="16" font-weight="600" fill="#ffffff">Eau</text>

  <!-- Mycélium -->
  <rect x="866" y="340" width="130" height="44" rx="12" fill="#1c1c1e"/>
  <circle cx="890" cy="362" r="7" fill="#bf5af2"/>
  <text x="906" y="367" font-family="-apple-system, Helvetica Neue, sans-serif"
        font-size="16" font-weight="600" fill="#ffffff">Mycélium</text>

  <!-- Bottom label -->
  <text x="80" y="580" font-family="-apple-system, Helvetica Neue, sans-serif"
        font-size="20" font-weight="500" fill="#2c2c2e">Jeu de société</text>
  <circle cx="226" cy="573" r="3" fill="#2c2c2e"/>
  <text x="238" y="580" font-family="-apple-system, Helvetica Neue, sans-serif"
        font-size="20" font-weight="500" fill="#2c2c2e">Tracker de prix</text>
</svg>
